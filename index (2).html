<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mahim Telecom and Electric Point</title>
<link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f1f6f5;--card:#fff;--ink:#12302f;--mut:#5d7775;--line:#dbe6e4;--pri:#0b5c4f;--side:#0d4a42;--ok:#117a3d;--blue:#1d4ed8;--bad:#c0392b;--soft:#e9f3f1;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;--bg:#0d1a19;--card:#152624;--ink:#e6f2f0;--mut:#93b0ad;--line:#27403d;--pri:#0a4a40;--side:#092a25;--soft:#1b302d}}
:root[data-theme="dark"]{color-scheme:dark;--bg:#0d1a19;--card:#152624;--ink:#e6f2f0;--mut:#93b0ad;--line:#27403d;--pri:#0a4a40;--side:#092a25;--soft:#1b302d}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 "Hind Siliguri",system-ui,sans-serif}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--pri);color:#fff;display:flex;align-items:center;gap:12px;padding:10px 14px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--pri);z-index:30}
header h1{margin:0;font-size:17px;line-height:1.2;font-weight:700}
header small{opacity:.8;font-size:12px;display:block;font-weight:400}
#tg{background:rgba(255,255,255,.14);border:0;color:#fff;width:42px;height:42px;border-radius:10px;font-size:22px;cursor:pointer;flex:none}
#tg:focus-visible,button:focus-visible,input:focus-visible,select:focus-visible,nav a:focus-visible{outline:3px solid #f5b53d;outline-offset:2px}
#th{margin-left:auto;background:none;border:0;color:#fff;font-size:20px;cursor:pointer}
nav{position:fixed;z-index:25;top:0;bottom:0;left:0;width:260px;max-width:82vw;background:var(--side);padding:calc(env(safe-area-inset-top,0px) + 70px) 12px 20px;transform:translateX(-100%);transition:transform .22s;overflow-y:auto}
body.open nav{transform:none}
nav a{display:flex;gap:10px;align-items:center;padding:12px 14px;border-radius:10px;color:#d7ece8;text-decoration:none;cursor:pointer;font-weight:500}
nav a.on{background:rgba(255,255,255,.14);color:#fff}
#ov{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:22;display:none}
body.open #ov{display:block}
@media(min-width:900px){nav{top:calc(env(safe-area-inset-top,0px) + 62px);padding-top:16px;transform:none}body.collapsed nav{transform:translateX(-100%)}body.open #ov{display:none}main{margin-left:260px}body.collapsed main{margin-left:0}}
main{padding:16px;max-width:1100px;transition:margin .22s}
h2{margin:4px 0 14px;font-size:22px}
h3{margin:0 0 10px;font-size:16px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:16px}
.two{display:grid;grid-template-columns:repeat(auto-fit,minmax(290px,1fr));gap:14px;margin-bottom:16px}
.st{background:var(--card);border-radius:12px;padding:12px 14px;border:1px solid var(--line);border-inline-start:6px solid var(--c,var(--pri))}
.st span{font-size:13px;color:var(--mut);display:block}.st b{font-size:22px;font-weight:600}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px}
label{display:block;font-size:13px;color:var(--mut);margin:8px 0 3px}
input,select{width:100%;padding:10px 11px;border:1px solid var(--line);border-radius:9px;background:var(--bg);color:var(--ink);font:inherit}
.row{display:flex;gap:8px;flex-wrap:wrap}.row>*{flex:1 1 120px}
button.b{border:0;border-radius:9px;padding:10px 14px;font:inherit;font-weight:600;color:#fff;background:var(--ok);cursor:pointer;margin:8px 6px 0 0}
button.b.bl{background:var(--blue)}button.b.rd{background:var(--bad)}button.b.gr{background:var(--mut)}
.tw{overflow-x:auto}table{width:100%;border-collapse:collapse;font-size:14px;white-space:nowrap}
th,td{text-align:left;padding:9px 8px;border-bottom:1px solid var(--line)}th{color:var(--mut);font-weight:600}
.low{color:var(--bad);font-weight:600}.tag{background:var(--soft);padding:2px 8px;border-radius:20px;font-size:12px}
.pay{font-size:22px;font-weight:700;color:var(--ok)}
.donut{width:130px;height:130px;border-radius:50%;margin:auto}
.donut i{display:block;width:70px;height:70px;border-radius:50%;background:var(--card);margin:30px}
.lg{font-size:13px;display:flex;gap:12px;justify-content:center;margin-top:8px;flex-wrap:wrap}
.lg u{text-decoration:none}.dt{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:4px}
.bars{background:#fff;display:inline-block;padding:6px 10px;border:1px dashed #999;margin:4px;text-align:center;color:#000;font-size:12px}
#ed{background:none;border:0;color:#fff;font-size:20px;cursor:pointer;margin-left:auto;width:38px;height:38px;border-radius:9px}#ed+#th{margin-left:0}body.edit #ed{background:#f5b53d;color:#000}.ed{display:none;margin-left:auto;font-style:normal;padding:0 6px}body.edit .ed{display:inline}body.edit main :is(h2,h3,label,th,p,span,button):hover,body.edit header h1:hover,body.edit header small:hover{outline:2px dashed #f5b53d;cursor:text}
@media print{header,nav,#ov,.np{display:none!important}main{margin:0}}
</style>
</head>
<body>
<header>
<button id="tg" onclick="tgl()" aria-label="মেনু খুলুন বা বন্ধ করুন">☰</button>
<h1>Mahim Telecom and Electric Point<small>Point of Sale Management System</small></h1>
<button id="ed" onclick="editMode()" aria-label="লেখা এডিট মোড">✎</button><button id="th" onclick="theme()" aria-label="থিম বদলান">◐</button>
</header>
<div id="ov" onclick="tgl()"></div>
<nav id="nav"></nav>
<main id="main"></main>

<script>
const MENU=[["dash","📊","ড্যাশবোর্ড"],["sale","💰","পণ্য বিক্রয়"],["mfs","📱","MFS"],["prod","📋","পণ্য ব্যবস্থাপনা"],["buy","🛍️","পণ্য ক্রয়"],["stock","📦","স্টক"],["exp","📉","খরচ"],["rep","📌","রিপোর্ট"],["cash","💵","ক্যাশ হিসাব"],["bar","▥","বারকোড স্টিকার"],["online","🌐","অনলাইন আবেদন"],["setup","⚙️","সেটিংস"]];
const $=s=>document.querySelector(s), tk=n=>Number(n||0).toLocaleString("en-IN",{minimumFractionDigits:2,maximumFractionDigits:2});
const T=(o=0)=>{const d=new Date();d.setDate(d.getDate()-o);return d.toLocaleDateString("en-CA")}, F=d=>d.split("-").reverse().join("-");
const sum=(a,f)=>a.reduce((s,x)=>s+f(x),0);
const seed=()=>({
 products:[
 {id:1,code:"AP01",name:"Airpods Pro Black Anc",cost:370,price:430,stock:6},
 {id:2,code:"RG01",name:"Rainbow Protector Glass",cost:29,price:70,stock:40},
 {id:3,code:"RM75",name:"Realme C75 4G",cost:80,price:100,stock:3},
 {id:4,code:"PP01",name:"Photo Print",cost:0,price:8,stock:0,svc:1},
 {id:5,code:"PC01",name:"Photocopy Black& Whie",cost:0,price:4,stock:0,svc:1},
 {id:6,code:"PC02",name:"Photocopy Colour",cost:0,price:10,stock:0,svc:1},
 {id:7,code:"MC01",name:"minitcat",cost:30,price:30,stock:12},
 {id:8,code:"TC01",name:"Type-C Cable",cost:60,price:120,stock:25},
 {id:9,code:"CH01",name:"Fast Charger 20W",cost:220,price:350,stock:4}],
 sales:[
 ["0009","Airpods Pro Black Anc",1,430,60,"2026-11-05"],["0008","Rainbow Protector Glass",1,70,41,"2026-11-05"],
 ["0007","Realme C75 4G",1,100,20,"2026-11-05"],["0006","Photo Print",5,40,40,"2026-11-05"],
 ["0005","Photocopy Black& Whie",5,20,20,"2026-11-05"],["0004","minitcat",1,30,0,"2026-11-05"],
 ["0003","minitcat",1,30,0,"2026-11-05"],["0002","Photo Print",2,20,20,"2026-11-05"],
 ["0001","Photocopy Colour",2,20,20,"2026-11-05"]].map(x=>({inv:"INV-"+x[5].replace(/-/g,"")+"-"+x[0],date:x[5],name:x[1],qty:x[2],total:x[3],profit:x[4]})),
 purchases:[],expenses:[],orders:[],
 mfs:{bKash:48075,Nagad:23200,Rocket:5075},
 mb:[["2026-11-05","bKash",3540],["2026-11-05","Rocket",1015],["2026-11-05","Nagad",23200],["2026-11-04","bKash",8070],["2026-11-04","bKash",11490]].map(x=>({date:x[0],svc:x[1],amt:x[2],com:0})),
 ms:[["2026-11-05","bKash",20],["2026-11-05","bKash",5000],["2026-11-04","bKash",128],["2026-11-04","bKash",1900],["2026-11-04","bKash",2500]].map(x=>({date:x[0],svc:x[1],amt:x[2],com:0,cost:0})),
 cash:73735,cashlog:[]
});
let S;try{S=JSON.parse(localStorage.getItem("mahim-pos"))}catch(e){}
if(!S||!S.products)S=seed();S.tx=S.tx||{};
const save=()=>{try{localStorage.setItem("mahim-pos",JSON.stringify(S))}catch(e){}};
let cur="dash",cart=[{pid:"",qty:1,price:""}];

function tgl(){const w=innerWidth>=900;document.body.classList.toggle(w?"collapsed":"open")}
function theme(){const r=document.documentElement,d=r.dataset.theme==="dark"||(!r.dataset.theme&&matchMedia("(prefers-color-scheme:dark)").matches);r.dataset.theme=d?"light":"dark"}
function go(p){cur=p;document.body.classList.remove("open");try{history.replaceState(null,"","#"+p)}catch(e){}draw();scrollTo(0,0)}
function draw(){$("#nav").innerHTML=MENU.map(m=>`<a class="${m[0]===cur?"on":""}" tabindex="0" onclick="go('${m[0]}')" onkeydown="if(event.key==='Enter')go('${m[0]}')"><span>${m[1]} ${m[2]}</span><i class="ed" data-ed="1">✎</i></a>`).join("");$("#main").innerHTML=(EDIT?'<div class="card bn" style="background:#f5b53d;color:#000;margin-bottom:12px">✎ এডিট মোড চালু: যেকোনো লেখায় ট্যাপ করে বদলান (মেনুতে লেখার পাশের ✎ চাপুন)। শেষে উপরের ✎ বাটনে আবার চাপুন।</div>':"")+P[cur]();if(cur==="sale")calc();applyTx(document.body)}
const st=(l,v,c)=>`<div class="st" style="--c:${c}"><span>${l}</span><b>${v}</b></div>`;
const tbl=(h,r)=>`<div class="tw"><table><tr>${h.map(x=>`<th>${x}</th>`).join("")}</tr>${r.length?r.map(x=>`<tr>${x.map(c=>`<td>${c}</td>`).join("")}</tr>`).join(""):`<tr><td colspan="${h.length}">এখনো কিছু নেই</td></tr>`}</table></div>`;
const sold=d=>S.sales.filter(s=>s.date===d), isLow=p=>!p.svc&&p.stock<=5;
const stockVal=()=>sum(S.products.filter(p=>!p.svc),p=>p.cost*p.stock);

const P={
dash(){const t=sold(T()),y=sold(T(1));
 const days=[...Array(7)].map((_,i)=>sum(sold(T(6-i)),s=>s.total)),mx=Math.max(...days,1);
 const pts=days.map((v,i)=>`${40+i*60},${130-(v/mx)*110}`).join(" ");
 const a=sum(S.sales,s=>s.total),b=sum(S.purchases,p=>p.total),c=sum(S.expenses,e=>e.amt),all=Math.max(a+b+c,1);
 const p1=a/all*100,p2=p1+b/all*100;
 return `<h2>ড্যাশবোর্ড</h2><div class="grid">
 ${st("আজকের বিক্রি","৳ "+tk(sum(t,s=>s.total)),"#1d8fe0")}${st("আজকের লাভ","৳ "+tk(sum(t,s=>s.profit)),"#16a34a")}
 ${st("মোট পণ্য",S.products.length,"#e0a800")}${st("কম স্টকের পণ্য",S.products.filter(isLow).length,"#e0457b")}
 ${st("গতকালের বিক্রি","৳ "+tk(sum(y,s=>s.total)),"#8b5cf6")}${st("গতকালের লাভ","৳ "+tk(sum(y,s=>s.profit)),"#f08a24")}
 ${st("মোট স্টক মূল্য","৳ "+tk(stockVal()),"#0ea5b7")}${st("ক্যাশ টাকা","৳ "+tk(S.cash),"#16a34a")}</div>
 <div class="two"><div class="card"><h3>📈 বিক্রয় গ্রাফ (৭ দিন)</h3><svg viewBox="0 0 440 150" width="100%" role="img" aria-label="৭ দিনের বিক্রয় গ্রাফ"><line x1="20" y1="130" x2="430" y2="130" stroke="var(--line)"/><polyline points="${pts}" fill="none" stroke="var(--blue)" stroke-width="3"/>${days.map((v,i)=>`<circle cx="${40+i*60}" cy="${130-(v/mx)*110}" r="4" fill="var(--blue)"/><text x="${40+i*60}" y="146" font-size="10" text-anchor="middle" fill="var(--mut)">${F(T(6-i)).slice(0,5)}</text>`).join("")}</svg></div>
 <div class="card"><h3>💰 বিক্রয়ের পাই চার্ট</h3><div class="donut" style="background:conic-gradient(#1d4ed8 0 ${p1}%,#16a34a ${p1}% ${p2}%,#f5a623 ${p2}% 100%)"><i></i></div><div class="lg"><u><span class="dt" style="background:#1d4ed8"></span>বিক্রয়</u><u><span class="dt" style="background:#16a34a"></span>ক্রয়</u><u><span class="dt" style="background:#f5a623"></span>অন্যান্য</u></div></div></div>
 <div class="card"><div class="row" style="justify-content:space-between;align-items:center"><h3>সাম্প্রতিক বিক্রয়</h3><button class="b np" style="flex:none" onclick="go('rep')">See All</button></div>
 ${tbl(["তারিখ","ইনভয়েস","পণ্য","পরিমাণ","মোট","লাভ"],S.sales.slice(-10).reverse().map(s=>[F(s.date),s.inv,s.name,s.qty,"৳ "+tk(s.total),"৳ "+tk(s.profit)]))}</div>`},

sale(){return `<h2>পণ্য বিক্রয়</h2><datalist id="pl">${S.products.map(p=>`<option value="${p.code}">${p.name}</option>`).join("")}</datalist>
 <div class="card" style="background:var(--ok);color:#fff;margin-bottom:12px"><label style="color:#d6f5e0">কোড / নাম লিখুন (Enter চাপুন)</label><input list="pl" id="q" placeholder="পণ্যের কোড বা নাম" onchange="qAdd(this)"></div>
 <div class="card" id="lines" style="margin-bottom:12px">${lines()}</div>
 <div class="two"><div class="card"><h3>বিলের হিসাব</h3><label>মোট বিল</label><input id="tot" readonly><label>ডিসকাউন্ট (টাকা)</label><input id="dis" type="number" min="0" value="0" oninput="calc()"><label>পরিশোধযোগ্য টাকা</label><div class="pay" id="pay">৳ 0.00</div></div>
 <div class="card"><h3>বিক্রয়ের কাজ</h3><button class="b bl" style="width:100%" onclick="cart.push({pid:'',qty:1,price:''});$('#lines').innerHTML=lines()">+ পণ্য যোগ করুন</button><button class="b" style="width:100%" onclick="finish()">✓ বিক্রয় সম্পূর্ণ করুন</button></div></div>
 <p style="color:var(--mut);font-size:13px">বিক্রয় সংরক্ষণের আগে পণ্য, পরিমাণ ও স্টক যাচাই করুন।</p>`},

mfs(){const m=S.mfs,f=(k)=>`<div class="row"><div><label>Amount</label><input id="${k}a" type="number" min="0" placeholder="টাকার পরিমাণ"></div><div><label>Commission</label><input id="${k}c" type="number" value="0"></div>${k==="s"?`<div><label>Cost</label><input id="sk" type="number" value="0"></div>`:""}<div><label>Reference / Last Number</label><input id="${k}r" placeholder="রেফারেন্স বা শেষ নম্বর"></div></div>`;
 const bt=(k,cl)=>["bKash","Nagad","Rocket"].map(s=>`<button class="b ${cl}" onclick="mf('${k}','${s}')">${{bKash:"বিকাশ",Nagad:"নগদ",Rocket:"রকেট"}[s]} ${k==="b"?"Buy":"Sale"}</button>`).join("");
 const t=sold(T()),ms=S.ms.filter(x=>x.date===T()),mb=S.mb.filter(x=>x.date===T());
 const mt=sum(ms,x=>x.amt)+sum(mb,x=>x.amt);
 return `<h2>MFS Management</h2><div class="grid">${st("বিকাশ ব্যালেন্স",tk(m.bKash),"#e0457b")}${st("নগদ ব্যালেন্স",tk(m.Nagad),"#16a34a")}${st("রকেট ব্যালেন্স",tk(m.Rocket),"#8b5cf6")}${st("মোট MFS ব্যালেন্স",tk(m.bKash+m.Nagad+m.Rocket),"#1d4ed8")}
 ${st("আজকের মোট লেনদেন",tk(mt),"#0ea5b7")}${st("আজকের লাভ",tk(sum(ms,x=>x.com-x.cost)+sum(mb,x=>x.com)),"#f08a24")}${st("ক্যাশ টাকা",tk(S.cash),"#16a34a")}</div>
 <div class="two"><div class="card"><h3>MFS Buy</h3>${f("b")}${bt("b","")}<h3 style="margin-top:16px">সর্বশেষ ৫টি Buy</h3>${tbl(["তারিখ","সার্ভিস","Amount"],S.mb.slice(-5).reverse().map(x=>[F(x.date),x.svc,tk(x.amt)]))}</div>
 <div class="card"><h3>MFS Sale</h3>${f("s")}${bt("s","bl")}<h3 style="margin-top:16px">সর্বশেষ ৫টি Sale</h3>${tbl(["তারিখ","সার্ভিস","Amount","Comm."],S.ms.slice(-5).reverse().map(x=>[F(x.date),x.svc,tk(x.amt),x.com]))}</div></div>`},

prod(){return `<h2>পণ্য ব্যবস্থাপনা</h2><div class="card" style="margin-bottom:14px"><h3>নতুন পণ্য</h3><div class="row"><div><label>কোড</label><input id="pc"></div><div><label>নাম</label><input id="pn"></div><div><label>ক্রয়মূল্য</label><input id="pcost" type="number"></div><div><label>বিক্রয়মূল্য</label><input id="pp" type="number"></div><div><label>স্টক</label><input id="ps" type="number" value="0"></div></div><button class="b" onclick="addP()">+ পণ্য সংরক্ষণ</button></div>
 <div class="card">${tbl(["কোড","নাম","ক্রয়","বিক্রয়","স্টক",""],S.products.map(p=>[p.code,p.name,tk(p.cost),tk(p.price),p.svc?"সেবা":p.stock,`<button class="b gr" style="margin:0" onclick="editP(${p.id})">এডিট</button> <button class="b rd" style="margin:0" onclick="delP(${p.id})">মুছুন</button>`]))}</div>`},

buy(){return `<h2>পণ্য ক্রয়</h2><div class="card" style="margin-bottom:14px"><div class="row"><div><label>পণ্য</label><select id="bp">${S.products.filter(p=>!p.svc).map(p=>`<option value="${p.id}">${p.name}</option>`).join("")}</select></div><div><label>পরিমাণ</label><input id="bq" type="number" min="1" value="1"></div><div><label>ক্রয়মূল্য (প্রতি পিস)</label><input id="bc" type="number"></div><div><label>সরবরাহকারী</label><input id="bs"></div></div><button class="b" onclick="doBuy()">✓ ক্রয় সংরক্ষণ</button></div>
 <div class="card">${tbl(["তারিখ","পণ্য","পরিমাণ","মোট","সরবরাহকারী",""],S.purchases.map((x,i)=>[F(x.date),x.name,x.qty,"৳ "+tk(x.total),x.sup||"-",dx("purchases",i)]).reverse())}</div>`},

stock(){return `<h2>স্টক</h2><div class="grid">${st("মোট স্টক মূল্য","৳ "+tk(stockVal()),"#0ea5b7")}${st("কম স্টক",S.products.filter(isLow).length,"#e0457b")}</div><div class="card">${tbl(["পণ্য","স্টক","মূল্য","অবস্থা"],S.products.filter(p=>!p.svc).map(p=>[p.name,p.stock,"৳ "+tk(p.cost*p.stock),isLow(p)?`<span class="low">কম স্টক</span>`:`<span class="tag">ঠিক আছে</span>`]))}</div>`},

exp(){return `<h2>খরচ</h2><div class="card" style="margin-bottom:14px"><div class="row"><div><label>খরচের বিবরণ</label><input id="en" placeholder="যেমন: দোকান ভাড়া"></div><div><label>টাকা</label><input id="ea" type="number"></div></div><button class="b rd" onclick="addE()">খরচ সংরক্ষণ</button></div><div class="card">${tbl(["তারিখ","বিবরণ","টাকা",""],S.expenses.map((e,i)=>[F(e.date),e.name,"৳ "+tk(e.amt),dx("expenses",i)]).reverse())}</div>`},

rep(){const a=sum(S.sales,s=>s.total),p=sum(S.sales,s=>s.profit),e=sum(S.expenses,x=>x.amt),ds=[...new Set(S.sales.map(s=>s.date))].sort().reverse();
 return `<h2>রিপোর্ট</h2><div class="grid">${st("মোট বিক্রি","৳ "+tk(a),"#1d4ed8")}${st("মোট লাভ","৳ "+tk(p),"#16a34a")}${st("মোট খরচ","৳ "+tk(e),"#c0392b")}${st("নিট লাভ","৳ "+tk(p-e),"#0ea5b7")}</div>
 <div class="card" style="margin-bottom:14px"><h3>দিনভিত্তিক</h3>${tbl(["তারিখ","বিক্রি","লাভ"],ds.map(d=>[F(d),"৳ "+tk(sum(sold(d),s=>s.total)),"৳ "+tk(sum(sold(d),s=>s.profit))]))}</div>
 <div class="card"><h3>সব বিক্রয়</h3>${tbl(["তারিখ","ইনভয়েস","পণ্য","পরিমাণ","মোট","লাভ",""],S.sales.map((s,i)=>[F(s.date),s.inv,s.name,s.qty,"৳ "+tk(s.total),"৳ "+tk(s.profit),dx("sales",i)]).reverse())}</div>`},

cash(){return `<h2>ক্যাশ হিসাব</h2><div class="grid">${st("ক্যাশ টাকা","৳ "+tk(S.cash),"#16a34a")}</div><div class="card" style="margin-bottom:14px"><div class="row"><div><label>বিবরণ</label><input id="cn"></div><div><label>টাকা</label><input id="ca" type="number"></div></div><button class="b" onclick="cashMv(1)">+ ক্যাশ জমা</button><button class="b rd" onclick="cashMv(-1)">− ক্যাশ উত্তোলন</button></div><div class="card">${tbl(["তারিখ","বিবরণ","টাকা"],S.cashlog.slice().reverse().map(c=>[F(c.date),c.name,(c.amt>0?"+":"")+tk(c.amt)]))}</div>`},

bar(){return `<h2>বারকোড স্টিকার</h2><p class="np" style="color:var(--mut)">প্রিন্ট করে পণ্যে লাগান।</p><button class="b np" onclick="print()">🖨 প্রিন্ট</button><div>${S.products.map(p=>`<div class="bars">${bc(p.code)}<br>${p.name}<br>৳ ${p.price}</div>`).join("")}</div>`},

online(){return `<h2>অনলাইন আবেদন</h2><div class="card" style="margin-bottom:14px"><div class="row"><div><label>গ্রাহকের নাম</label><input id="on"></div><div><label>মোবাইল</label><input id="om" inputmode="tel"></div><div><label>আবেদনের বিষয়</label><input id="oi" placeholder="যেমন: NID সংশোধন"></div></div><button class="b" onclick="addO()">+ আবেদন যোগ করুন</button></div><div class="card">${tbl(["তারিখ","নাম","মোবাইল","বিষয়","অবস্থা",""],S.orders.map((o,i)=>[F(o.date),o.name,o.mob,o.item,`<button class="b gr" style="margin:0" onclick="nextO(${o.id})">${o.status}</button>`,dx("orders",i)]).reverse())}</div>`}
};

function lines(){return cart.map((l,i)=>{const p=S.products.find(x=>x.id==l.pid);return `<div class="row" style="align-items:end;margin-bottom:8px"><div style="flex:2 1 180px"><label>পণ্যের নাম</label><select onchange="pick(${i},this.value)"><option value="">পণ্য নির্বাচন করুন</option>${S.products.map(x=>`<option value="${x.id}" ${x.id==l.pid?"selected":""}>${x.name}${x.svc?"":" ("+x.stock+")"}</option>`).join("")}</select></div><div><label>পরিমাণ</label><input type="number" min="1" value="${l.qty}" oninput="cart[${i}].qty=+this.value;calc()"></div><div><label>দাম</label><input type="number" id="pr${i}" value="${l.price}" oninput="cart[${i}].price=+this.value;calc()"></div><div><label>মোট</label><input readonly id="lt${i}"></div><button class="b rd" style="flex:none;margin:0" onclick="cart.splice(${i},1);if(!cart.length)cart.push({pid:'',qty:1,price:''});$('#lines').innerHTML=lines();calc()" aria-label="বাদ দিন">✕</button></div>`}).join("")}
function pick(i,v){const p=S.products.find(x=>x.id==v);cart[i].pid=v;cart[i].price=p?p.price:"";$("#lines").innerHTML=lines();calc()}
function qAdd(el){const v=el.value.trim().toLowerCase(),p=S.products.find(x=>x.code.toLowerCase()===v||x.name.toLowerCase()===v)||S.products.find(x=>x.name.toLowerCase().includes(v));el.value="";if(!p)return alert("পণ্য পাওয়া যায়নি");const e=cart.find(l=>!l.pid);if(e){e.pid=p.id;e.price=p.price}else cart.push({pid:p.id,qty:1,price:p.price});$("#lines").innerHTML=lines();calc()}
function calc(){let t=0;cart.forEach((l,i)=>{const x=(+l.qty||0)*(+l.price||0);t+=x;const e=$("#lt"+i);if(e)e.value="৳ "+tk(x)});const d=+($("#dis")||{}).value||0;if($("#tot"))$("#tot").value="৳ "+tk(t);if($("#pay"))$("#pay").textContent="৳ "+tk(Math.max(t-d,0))}
function finish(){const ls=cart.filter(l=>l.pid&&l.qty>0);if(!ls.length)return alert("কমপক্ষে একটি পণ্য নির্বাচন করুন");
 for(const l of ls){const p=S.products.find(x=>x.id==l.pid);if(!p.svc&&p.stock<l.qty)return alert(p.name+" — স্টকে মাত্র "+p.stock+" টি আছে")}
 const d=+$("#dis").value||0,date=T(),n=sold(date).length+1;let first=true;
 ls.forEach(l=>{const p=S.products.find(x=>x.id==l.pid),tot=l.qty*l.price,off=first?d:0;first=false;if(!p.svc)p.stock-=l.qty;
  S.sales.push({inv:"INV-"+date.replace(/-/g,"")+"-"+String(n+S.sales.filter(s=>s.date===date&&s.name!==p.name).length%1000).padStart(4,"0"),date,name:p.name,qty:l.qty,total:tot-off,profit:tot-off-l.qty*p.cost});S.cash+=tot-off});
 cart=[{pid:"",qty:1,price:""}];save();alert("বিক্রয় সম্পন্ন হয়েছে");go("dash")}
function mf(k,s){const a=+$("#"+k+"a").value,c=+$("#"+k+"c").value||0;if(!(a>0))return alert("টাকার পরিমাণ লিখুন");
 if(k==="b"){S.mfs[s]+=a;S.cash-=a-c;S.mb.push({date:T(),svc:s,amt:a,com:c})}
 else{if(S.mfs[s]<a)return alert(s+" ব্যালেন্স যথেষ্ট নয়");const co=+$("#sk").value||0;S.mfs[s]-=a;S.cash+=a+c;S.ms.push({date:T(),svc:s,amt:a,com:c,cost:co})}
 save();draw()}
function addP(){const n=$("#pn").value.trim();if(!n)return alert("নাম লিখুন");S.products.push({id:Date.now(),code:$("#pc").value.trim()||"P"+Date.now()%10000,name:n,cost:+$("#pcost").value||0,price:+$("#pp").value||0,stock:+$("#ps").value||0});save();draw()}
function editP(id){const p=S.products.find(x=>x.id===id),n=prompt("পণ্যের নাম",p.name);if(n===null)return;p.name=n||p.name;const pr=prompt("বিক্রয়মূল্য",p.price);if(pr!==null&&pr!=="")p.price=+pr;if(!p.svc){const s=prompt("স্টক",p.stock);if(s!==null&&s!=="")p.stock=+s}save();draw()}
function delP(id){if(confirm("পণ্যটি মুছবেন?")){S.products=S.products.filter(x=>x.id!==id);save();draw()}}
function doBuy(){const p=S.products.find(x=>x.id==$("#bp").value),q=+$("#bq").value,c=+$("#bc").value;if(!p||!(q>0)||!(c>=0)||$("#bc").value==="")return alert("পণ্য, পরিমাণ ও দাম দিন");p.stock+=q;p.cost=c;S.cash-=q*c;S.purchases.push({date:T(),name:p.name,qty:q,total:q*c,sup:$("#bs").value});save();draw()}
function addE(){const n=$("#en").value.trim(),a=+$("#ea").value;if(!n||!(a>0))return alert("বিবরণ ও টাকা দিন");S.expenses.push({date:T(),name:n,amt:a});S.cash-=a;save();draw()}
function cashMv(s){const a=+$("#ca").value;if(!(a>0))return alert("টাকার পরিমাণ লিখুন");S.cash+=s*a;S.cashlog.push({date:T(),name:$("#cn").value||(s>0?"ক্যাশ জমা":"ক্যাশ উত্তোলন"),amt:s*a});save();draw()}
function addO(){const n=$("#on").value.trim();if(!n)return alert("গ্রাহকের নাম লিখুন");S.orders.push({id:Date.now(),date:T(),name:n,mob:$("#om").value,item:$("#oi").value,status:"নতুন"});save();draw()}
function nextO(id){const o=S.orders.find(x=>x.id===id),s=["নতুন","প্রক্রিয়াধীন","সম্পন্ন"];o.status=s[(s.indexOf(o.status)+1)%3];save();draw()}
function bc(code){let x=4,r="";for(const ch of code){const b=ch.charCodeAt(0).toString(2).padStart(8,"0");for(const bit of b){if(bit==="1")r+=`<rect x="${x}" y="0" width="2" height="34"/>`;x+=2}x+=2}return `<svg width="${x+4}" height="34" fill="#000">${r}</svg><br>${code}`}
let EDIT=false;const OR=new WeakMap();
const okT=n=>{const p=n.parentElement;return p&&!/^(SCRIPT|STYLE|TD|OPTION|TEXTAREA)$/.test(p.tagName)&&!p.closest(".bn,.bars,datalist")&&/\p{L}/u.test(n.data)};
function applyTx(r){const w=document.createTreeWalker(r,NodeFilter.SHOW_TEXT),a=[];let n;while(n=w.nextNode())a.push(n);a.forEach(n=>{if(!okT(n))return;let o=OR.get(n);if(o===undefined){o=n.data.trim();OR.set(n,o)}const t=S.tx[o],c=n.data.trim();n.data=n.data.replace(c,()=>t!==undefined?t:o)});const h=document.querySelector("header h1");if(h&&h.childNodes[0])document.title=h.childNodes[0].data.trim()}
function editMode(){EDIT=!EDIT;document.body.classList.toggle("edit",EDIT);draw()}
function txEdit(n){const o=OR.get(n);if(o===undefined)return;const v=prompt("নতুন লেখা (ফাঁকা রাখলে আগের লেখা ফিরবে)",n.data.trim());if(v===null)return;if(v.trim())S.tx[o]=v.trim();else delete S.tx[o];save();draw()}
document.addEventListener("click",e=>{if(!EDIT)return;const t=e.target;if(/^(INPUT|SELECT|TEXTAREA)$/.test(t.tagName)||/^(tg|th|ed)$/.test(t.id)||t.closest("#ov"))return;let el=t;if(t.dataset&&t.dataset.ed)el=t.previousElementSibling;else if(t.closest("nav"))return;const n=[...el.childNodes].find(x=>x.nodeType===3&&okT(x));if(!n)return;e.preventDefault();e.stopPropagation();txEdit(n)},true);
const dx=(k,i)=>`<button class="b rd" style="margin:0;padding:2px 9px" onclick="del('${k}',${i})" aria-label="মুছুন">✕</button>`;
function del(k,i){if(!confirm("মুছে ফেলবেন?"))return;const x=S[k][i],fp=()=>S.products.find(p=>p.name===x.name);
 if(k==="sales"){S.cash-=x.total;const p=fp();if(p&&!p.svc)p.stock+=x.qty}
 if(k==="expenses")S.cash+=x.amt;
 if(k==="purchases"){S.cash+=x.total;const p=fp();if(p)p.stock=Math.max(0,p.stock-x.qty)}
 S[k].splice(i,1);save();draw()}
P.setup=()=>`<h2>সেটিংস</h2>
<div class="card" style="margin-bottom:14px"><h3>ব্যবসার নাম ও সব লেখা বদলান</h3><p style="color:var(--mut)">ব্যবসার নাম, মেনু, কার্ড, বাটন ও ফর্মের লেখা সবই নিজের মতো বদলানো যায়। উপরের ✎ বাটনে এডিট মোড চালু করে যেকোনো লেখায় ট্যাপ করুন।</p><button class="b bl" onclick="editMode();go('dash')">✎ এডিট মোড চালু/বন্ধ</button><button class="b gr" onclick="if(confirm('সব লেখা আগের অবস্থায় ফিরবে?')){S.tx={};save();draw()}">সব লেখা আগের অবস্থায় ফেরান</button></div>
<div class="card" style="margin-bottom:14px"><h3>শুরুর ব্যালেন্স</h3><div class="row"><div><label>ক্যাশ টাকা</label><input id="sc" type="number" value="${S.cash}"></div><div><label>বিকাশ ব্যালেন্স</label><input id="sb" type="number" value="${S.mfs.bKash}"></div><div><label>নগদ ব্যালেন্স</label><input id="sn" type="number" value="${S.mfs.Nagad}"></div><div><label>রকেট ব্যালেন্স</label><input id="sr" type="number" value="${S.mfs.Rocket}"></div></div><button class="b" onclick="setBal()">ব্যালেন্স সংরক্ষণ</button></div>
<div class="card"><h3>ডেটা</h3><p style="color:var(--mut)">নিজের ব্যবসার জন্য নমুনা ডেটা মুছে ফাঁকা থেকে শুরু করুন।</p><button class="b rd" onclick="blank()">ফাঁকা ডেটা দিয়ে শুরু করুন</button><button class="b gr" onclick="demo()">নমুনা ডেটা ফিরিয়ে আনুন</button></div>`;
function setBal(){S.cash=+$("#sc").value||0;S.mfs.bKash=+$("#sb").value||0;S.mfs.Nagad=+$("#sn").value||0;S.mfs.Rocket=+$("#sr").value||0;save();alert("সংরক্ষণ হয়েছে");draw()}
function blank(){if(!confirm("সব নমুনা ডেটা মুছে ফাঁকা করবেন?"))return;const tx=S.tx;S={products:[],sales:[],purchases:[],expenses:[],orders:[],mfs:{bKash:0,Nagad:0,Rocket:0},mb:[],ms:[],cash:0,cashlog:[],tx};save();go("dash")}
function demo(){if(!confirm("বর্তমান ডেটা মুছে নমুনা ডেটা আসবে। চালিয়ে যাবেন?"))return;const tx=S.tx;S=seed();S.tx=tx;save();go("dash")}
const h=location.hash.slice(1);if(P[h])cur=h;
if(innerWidth>=900)document.body.classList.remove("collapsed");
draw();
</script>
</body>
</html>
